[package]
name = "lafei"
version = "0.6.0"
description = "Lafei — 笔记、任务与内置 AI"
authors = ["Lafei"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "lafei_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "http2", "system-proxy", "charset"] }
futures-util = "0.3"
regex = "1"
